<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>陪你学习</title>
<style>
  :root{
    --ink:#1c1c1e;
    --ink-2:rgba(28,28,30,.58);
    --ga:.52;
    --blur:26px;
    --glass:rgba(255,255,255,var(--ga));
    --glass-strong:rgba(255,255,255,calc(var(--ga) + .18));
    --glass-edge:rgba(255,255,255,.65);
    --bubble:rgba(255,255,255,calc(var(--ga) + .1));
    --bubble-text:#1c1c1e;
    --me:#1c1c1e;
    --me-text:#fff;
    --shadow:0 10px 40px rgba(20,24,40,.10);
  }
  .dark{
    --ink:#f5f5f7;
    --ink-2:rgba(245,245,247,.62);
    --glass:rgba(28,30,38,var(--ga));
    --glass-strong:rgba(28,30,38,calc(var(--ga) + .18));
    --glass-edge:rgba(255,255,255,.14);
    --bubble:rgba(48,50,60,calc(var(--ga) + .05));
    --bubble-text:#f5f5f7;
    --me:#f5f5f7;
    --me-text:#1c1c1e;
    --shadow:0 10px 40px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:#cfd6e4}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
    color:var(--ink);-webkit-font-smoothing:antialiased;
  }

  .bg{position:fixed;inset:0;background-size:cover;background-position:center;opacity:0;transition:opacity .9s ease;transform:scale(1.04)}
  .bg.show{opacity:1}
  .grain{position:fixed;inset:0;pointer-events:none;opacity:.09;mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}

  .app{position:fixed;inset:0;margin:0 auto;max-width:520px;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}

  .glass{
    background:var(--glass);
    -webkit-backdrop-filter:blur(var(--blur)) saturate(170%);
    backdrop-filter:blur(var(--blur)) saturate(170%);
    border:1px solid var(--glass-edge);
    box-shadow:var(--shadow), inset 0 1px 0 rgba(255,255,255,.25);
  }

  header{display:flex;align-items:center;gap:8px;padding:11px 11px 11px 13px;margin:10px 12px 0;border-radius:26px}
  .avatar{
    width:42px;height:42px;border-radius:50%;flex:none;position:relative;
    display:grid;place-items:center;font-size:17px;font-weight:600;
    background:linear-gradient(145deg,var(--glass-strong),var(--glass));border:1px solid var(--glass-edge);
  }
  .avatar i{position:absolute;right:-1px;bottom:-1px;width:11px;height:11px;border-radius:50%;background:#b9bcc4;border:2px solid var(--glass-strong);transition:background .4s}
  .running .avatar i{background:#34c759;animation:pulse 2.4s ease-in-out infinite}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(52,199,89,.45)}50%{box-shadow:0 0 0 6px rgba(52,199,89,0)}}
  .who{flex:1;min-width:0}
  .name{font-size:17px;font-weight:600;line-height:1.2;outline:none;display:inline-block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .name:focus{border-bottom:1px solid var(--ink-2)}
  .status{font-size:13px;color:var(--ink-2);line-height:1.3;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:opacity .35s}
  .pill{
    cursor:pointer;font:inherit;font-size:14px;font-weight:500;color:var(--ink);
    padding:8px 12px;border-radius:999px;background:var(--glass-strong);
    border:1px solid var(--glass-edge);transition:transform .15s;white-space:nowrap;
  }
  .pill:active{transform:scale(.96)}
  header .pill{padding:8px 11px}

  main{flex:1;overflow-y:auto;padding:14px 12px 10px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  main::-webkit-scrollbar{display:none}

  .timer{border-radius:32px;padding:22px 20px 20px;text-align:center;margin-bottom:18px}
  .timer .label{font-size:14px;color:var(--ink-2)}
  .clock{font-size:58px;font-weight:200;letter-spacing:1px;line-height:1.15;font-variant-numeric:tabular-nums;margin-top:2px}
  .count{font-size:13.5px;color:var(--ink-2);margin-top:2px;min-height:18px}
  .track{height:3px;border-radius:3px;background:var(--glass-edge);margin:12px auto 16px;max-width:240px;overflow:hidden}
  .track b{display:block;height:100%;width:0;background:var(--ink);border-radius:3px;transition:width .4s linear}
  .cur{display:none;margin:0 auto 14px;max-width:270px}
  .running .cur{display:block}
  .cur input{width:100%;text-align:center;border:1px solid var(--glass-edge);background:var(--glass-strong);border-radius:999px;height:38px;font:inherit;font-size:15px;color:var(--ink);outline:none;padding:0 14px}
  .cur input::placeholder{color:var(--ink-2)}
  .go{
    border:0;cursor:pointer;font:inherit;font-size:17px;font-weight:500;
    background:var(--me);color:var(--me-text);padding:14px 38px;border-radius:18px;min-width:160px;transition:transform .15s;
  }
  .go:active{transform:scale(.97)}

  .stamp{text-align:center;font-size:12px;color:var(--ink-2);margin:14px 0 8px}
  .row{display:flex;margin:3px 0}
  .row.me{justify-content:flex-end}
  .b{
    max-width:78%;padding:10px 15px;font-size:16.5px;line-height:1.45;border-radius:22px;
    word-wrap:break-word;white-space:pre-wrap;animation:pop .32s cubic-bezier(.2,.9,.3,1.2);
  }
  .still .b{animation:none}
  @keyframes pop{from{opacity:0;transform:translateY(8px) scale(.96)}to{opacity:1;transform:none}}
  .row.them .b{
    background:var(--bubble);color:var(--bubble-text);border-bottom-left-radius:8px;
    -webkit-backdrop-filter:blur(18px) saturate(160%);backdrop-filter:blur(18px) saturate(160%);
    border:1px solid var(--glass-edge);
  }
  .row.me .b{background:var(--me);color:var(--me-text);border-bottom-right-radius:8px}
  .row.act .b{font-size:15.5px}
  .typing .b{display:flex;gap:5px;padding:14px 16px}
  .typing span{width:7px;height:7px;border-radius:50%;background:var(--ink-2);animation:dot 1.2s infinite}
  .typing span:nth-child(2){animation-delay:.15s}
  .typing span:nth-child(3){animation-delay:.3s}
  @keyframes dot{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
  .note{text-align:center;font-size:12.5px;color:var(--ink-2);margin:12px 0}

  footer{display:flex;gap:10px;padding:8px 12px calc(12px + env(safe-area-inset-bottom))}
  .field{flex:1;border-radius:999px;padding:0 20px;display:flex;align-items:center}
  .field input{flex:1;width:100%;border:0;background:none;outline:none;font:inherit;font-size:16.5px;color:var(--ink);height:50px}
  .field input::placeholder{color:var(--ink-2)}
  .send{width:50px;height:50px;border-radius:50%;border:0;cursor:pointer;flex:none;background:var(--me);color:var(--me-text);display:grid;place-items:center;transition:transform .15s}
  .send:active{transform:scale(.93)}
  .send svg{width:22px;height:22px}

  /* sheets */
  .scrim{position:fixed;inset:0;z-index:19;background:rgba(0,0,0,.22);opacity:0;pointer-events:none;transition:opacity .3s}
  .scrim.open{opacity:1;pointer-events:auto}
  .sheet{
    position:fixed;z-index:20;left:50%;bottom:0;width:100%;max-width:520px;max-height:88dvh;overflow-y:auto;
    transform:translate(-50%,108%);transition:transform .42s cubic-bezier(.2,.85,.25,1);
    border-radius:32px 32px 0 0;padding:10px 20px calc(24px + env(safe-area-inset-bottom));
    background:var(--glass-strong);color:var(--ink);scrollbar-width:none;
  }
  .sheet::-webkit-scrollbar{display:none}
  .sheet.open{transform:translate(-50%,0)}
  .grab{width:38px;height:5px;border-radius:5px;background:var(--ink-2);opacity:.4;margin:0 auto 14px}
  .sheet h3{margin:0 0 4px;font-size:20px;font-weight:600}
  .sub{font-size:13px;color:var(--ink-2);margin-bottom:14px;line-height:1.5}
  .cap{font-size:13px;color:var(--ink-2);margin:18px 0 8px}

  .upload{
    width:100%;border:0;cursor:pointer;font:inherit;font-size:16px;font-weight:500;
    background:var(--me);color:var(--me-text);padding:14px;border-radius:16px;margin-bottom:14px;
    position:relative;overflow:hidden;display:block;text-align:center;
  }
  .upload input,.filepill input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0}
  .urlrow{display:flex;gap:8px;margin-bottom:14px}
  .urlrow input{flex:1;min-width:0;border:1px solid var(--glass-edge);background:var(--glass);border-radius:14px;padding:0 14px;height:42px;font:inherit;font-size:15px;color:var(--ink);outline:none}
  .urlrow input::placeholder{color:var(--ink-2)}
  .presets{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .sw{aspect-ratio:1/1.1;border-radius:18px;border:2px solid transparent;cursor:pointer;background-size:cover;background-position:center;position:relative;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.12);transition:transform .15s}
  .sw:active{transform:scale(.96)}
  .sw.on{border-color:var(--ink)}
  .sw span{position:absolute;left:0;right:0;bottom:0;padding:16px 8px 7px;font-size:12.5px;color:#fff;text-align:center;background:linear-gradient(transparent,rgba(0,0,0,.35))}
  .seg{display:flex;background:var(--glass);border-radius:14px;padding:3px;border:1px solid var(--glass-edge)}
  .seg button{flex:1;border:0;background:none;font:inherit;font-size:15px;color:var(--ink);padding:9px;border-radius:11px;cursor:pointer}
  .seg button.on{background:var(--glass-strong);box-shadow:0 1px 6px rgba(0,0,0,.12);font-weight:600}
  .slider{display:flex;align-items:center;gap:12px;font-size:14px;margin:10px 0}
  .slider span{width:56px;color:var(--ink-2)}
  .slider input{flex:1;accent-color:var(--ink)}

  /* settings */
  .fld{display:block;margin-bottom:12px}
  .fld span{display:block;font-size:13px;color:var(--ink-2);margin-bottom:5px}
  .fld input,.txt{width:100%;border:1px solid var(--glass-edge);background:var(--glass);border-radius:14px;padding:0 14px;height:44px;font:inherit;font-size:15px;color:var(--ink);outline:none}
  .txt{height:84px;padding:10px 14px;resize:none;font-size:13px;line-height:1.4;margin:10px 0}
  .btnrow{display:flex;gap:10px;margin:4px 0 10px}
  .btnrow .pill{flex:1;text-align:center;padding:12px 8px;position:relative;overflow:hidden}
  .filepill{position:relative}
  .chk{display:flex;align-items:center;gap:10px;font-size:15px;margin:4px 0}
  .chk input{width:20px;height:20px;accent-color:var(--ink)}

  /* records */
  .nav{display:flex;align-items:center;justify-content:space-between;margin:2px 0 14px}
  .nav button{width:38px;height:38px;border-radius:50%;border:1px solid var(--glass-edge);background:var(--glass);color:var(--ink);font-size:18px;cursor:pointer;font-family:inherit}
  .nav button:disabled{opacity:.3;cursor:default}
  .nav div{text-align:center}
  .nav b{font-size:17px;font-weight:600;display:block}
  .nav small{font-size:12.5px;color:var(--ink-2)}
  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .tile{background:var(--glass);border:1px solid var(--glass-edge);border-radius:20px;padding:14px 16px}
  .tile .n{font-size:30px;font-weight:300;font-variant-numeric:tabular-nums;line-height:1.1}
  .tile .n small{font-size:14px;color:var(--ink-2);margin-left:3px;font-weight:400}
  .tile .t{font-size:13px;color:var(--ink-2);margin-top:4px}
  .bars{display:flex;align-items:flex-end;gap:8px;height:120px;padding-top:6px}
  .bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:5px;cursor:pointer}
  .bar em{font-style:normal;font-size:11px;color:var(--ink-2);font-variant-numeric:tabular-nums;min-height:13px}
  .bar div{width:100%;max-width:30px;border-radius:8px;background:var(--ink);opacity:.25;min-height:4px;transition:height .5s}
  .bar.sel div{opacity:.9}
  .bar span{font-size:12px;color:var(--ink-2)}
  .bar.sel span{color:var(--ink);font-weight:600}
  .list{display:flex;flex-direction:column}
  .li{display:flex;flex-direction:column;gap:5px;padding:13px 2px;border-bottom:1px solid var(--glass-edge)}
  .li:last-child{border-bottom:0}
  .li .top{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
  .li .nm{font-weight:600;font-size:15.5px;min-width:0;overflow-wrap:anywhere}
  .li .du{font-variant-numeric:tabular-nums;font-size:15px;white-space:nowrap}
  .li .tm{color:var(--ink-2);font-size:13px;font-variant-numeric:tabular-nums}
  .li .nt{font-size:13px;color:var(--ink-2);line-height:1.55}
  .li .acts{display:flex;gap:18px;margin-top:2px}
  .li .acts button{border:0;background:none;font:inherit;font-size:13.5px;color:var(--ink-2);padding:3px 0;cursor:pointer}
  .li .acts button.del{color:#d4453b}
  .li .ri{width:100%;border:1px solid var(--glass-edge);background:var(--glass);border-radius:12px;padding:0 12px;height:38px;font:inherit;font-size:15px;color:var(--ink);outline:none}
  .empty{color:var(--ink-2);font-size:14px;padding:10px 2px}
  .dangers{display:flex;justify-content:center;gap:24px}
  .danger{border:0;background:none;font:inherit;font-size:14px;color:#d4453b;cursor:pointer;padding:16px 0 0}

  :focus-visible{outline:2px solid var(--ink);outline-offset:2px}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="bg" id="bgA"></div>
<div class="bg" id="bgB"></div>
<div class="grain"></div>

<div class="app" id="app">
  <header class="glass">
    <div class="avatar"><span id="initial">C</span><i></i></div>
    <div class="who">
      <span class="name" id="name" contenteditable="true" spellcheck="false" title="点击修改名字">Claude</span>
      <div class="status" id="status">在这儿陪着你</div>
    </div>
    <button class="pill" id="recBtn">记录</button>
    <button class="pill" id="bgBtn">背景</button>
    <button class="pill" id="setBtn">设置</button>
  </header>

  <main id="scroll">
    <section class="timer glass">
      <div class="label" id="dateLabel">今日专注</div>
      <div class="clock" id="clock">00:00:00</div>
      <div class="count" id="count"></div>
      <div class="track"><b id="prog"></b></div>
      <div class="cur"><input id="curName" maxlength="30" placeholder="给这次专注起个名字" enterkeyhint="done"></div>
      <button class="go" id="go">开始专注</button>
    </section>
    <div id="feed"></div>
  </main>

  <footer>
    <div class="field glass"><input id="inp" placeholder="和我说句话……" autocomplete="off" enterkeyhint="send"></div>
    <button class="send" id="send" aria-label="发送">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
    </button>
  </footer>
</div>

<div class="scrim" id="scrim"></div>

<!-- background sheet -->
<div class="sheet glass" id="bgSheet">
  <div class="grab"></div>
  <h3>换背景</h3>
  <div class="sub">用你自己的图片，或选一个柔和的底色</div>
  <label class="upload" id="upBtn">从相册选择图片<input type="file" id="file" accept="image/*"></label>
  <div class="sub" id="upMsg" style="margin:-4px 0 12px">选择文件没反应时，可以粘贴图片链接。</div>
  <div class="urlrow"><input id="urlIn" placeholder="粘贴图片链接（http 开头）" inputmode="url"><button class="pill" id="urlBtn">使用</button></div>
  <div class="presets" id="presets"></div>
  <div class="cap">玻璃色调</div>
  <div class="seg" id="seg">
    <button data-t="light" class="on">浅色</button>
    <button data-t="dark">深色</button>
  </div>
  <div class="cap">磨砂质感</div>
  <label class="slider"><span>透明度</span><input type="range" id="rAlpha" min="15" max="85" value="52"></label>
  <label class="slider"><span>模糊度</span><input type="range" id="rBlur" min="6" max="44" value="26"></label>
</div>

<!-- settings sheet -->
<div class="sheet glass" id="setSheet">
  <div class="grab"></div>
  <h3>设置</h3>

  <div class="cap">聊天模型（DeepSeek 或其他兼容接口）</div>
  <label class="fld"><span>API 密钥</span><input id="cKey" type="password" placeholder="sk-……" autocomplete="off" spellcheck="false"></label>
  <label class="fld"><span>接口地址</span><input id="cBase" placeholder="https://api.deepseek.com" autocomplete="off" inputmode="url" spellcheck="false"></label>
  <label class="fld"><span>模型名称</span><input id="cModel" list="models" placeholder="deepseek-flash" autocomplete="off" spellcheck="false"><datalist id="models"><option value="deepseek-flash"><option value="deepseek-v4-pro"></datalist></label>
  <div class="btnrow"><button class="pill" id="testBtn">测试连接</button></div>
  <div class="sub" id="llmMsg">密钥只保存在这台设备的浏览器里，不会写进代码，也不会出现在备份文件里。</div>

  <div class="cap">专注</div>
  <label class="fld"><span>每日目标（分钟，0 为不设）</span><input id="cGoal" type="number" min="0" max="1440" inputmode="numeric"></label>
  <label class="chk"><input type="checkbox" id="cWake"><span>专注时保持屏幕常亮</span></label>

  <div class="cap">数据与备份</div>
  <div class="sub" id="saveInfo"></div>
  <div class="btnrow">
    <button class="pill" id="bkExport">导出备份文件</button>
    <button class="pill" id="bkCopy">复制备份文本</button>
  </div>
  <textarea class="txt" id="bkText" placeholder="备份文本粘贴在这里，再点「从文本恢复」" spellcheck="false"></textarea>
  <div class="btnrow">
    <button class="pill" id="bkPaste">从文本恢复</button>
    <label class="pill filepill">从文件恢复<input type="file" id="bkFile"></label>
  </div>
  <div class="sub" id="bkMsg"></div>
</div>

<!-- records sheet -->
<div class="sheet glass" id="recSheet">
  <div class="grab"></div>
  <h3>专注记录</h3>
  <div class="sub" id="recSub"></div>
  <div class="nav">
    <button id="navPrev" aria-label="前一天">‹</button>
    <div><b id="navLabel"></b><small id="navSub"></small></div>
    <button id="navNext" aria-label="后一天">›</button>
  </div>
  <div class="tiles">
    <div class="tile"><div class="n" id="tDayN">0<small>次</small></div><div class="t">当天次数</div></div>
    <div class="tile"><div class="n" id="tDayD">0<small>分钟</small></div><div class="t">当天时长</div></div>
    <div class="tile"><div class="n" id="tWeekN">0<small>次</small></div><div class="t">近 7 天次数</div></div>
    <div class="tile"><div class="n" id="tWeekD">0<small>分钟</small></div><div class="t">近 7 天时长</div></div>
  </div>
  <div class="cap">近 7 天（分钟，点一下可查看那天）</div>
  <div class="bars" id="bars"></div>
  <div class="cap" id="listCap">当天的每一次</div>
  <div class="list" id="dayList"></div>
  <div class="dangers">
    <button class="danger" id="clearChat">清空聊天记录</button>
    <button class="danger" id="clearBtn">清空专注记录</button>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const app = $('#app'), feed = $('#feed'), scrollEl = $('#scroll');
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pick = a => a[Math.floor(Math.random()*a.length)];
const rand = (a,b)=>a+Math.random()*(b-a);

/* =====================================================================
   存储：同时写入三个地方（Claude 存储 / 本地存储 / IndexedDB），读取时取最新的一份。
   任何一个被清掉，另外的还在；再加上「导出备份」，记录基本不会丢。
   ===================================================================== */
const mem = {};
let storeLayers = [], persistState = '未知';
const wrap = v => ({__sc:1, ts:Date.now(), v});
const unwrap = x => x==null ? null : (x && x.__sc===1 ? {ts:x.ts||0, v:x.v} : {ts:0, v:x});
const idb = {
  p:null,
  open(){
    if(!this.p) this.p = new Promise((res,rej)=>{
      try{
        const q = indexedDB.open('study-companion',1);
        q.onupgradeneeded = ()=>q.result.createObjectStore('kv');
        q.onsuccess = ()=>res(q.result); q.onerror = ()=>rej(q.error);
      }catch(e){ rej(e); }
    });
    return this.p;

const store = {
  async get(k){
    const c = [];
    try{ if(window.storage){ const r = await window.storage.get(k); if(r && r.value) c.push(unwrap(JSON.parse(r.value))); } }catch(e){}
    try{ const v = localStorage.getItem(k); if(v) c.push(unwrap(JSON.parse(v))); }catch(e){}
    try{ const v = await idb.get(k); if(v!=null) c.push(unwrap(v)); }catch(e){}
    if(mem[k]) c.push(unwrap(mem[k]));
    const ok = c.filter(Boolean); if(!ok.length) return null;
    return ok.reduce((a,b)=> b.ts > a.ts ? b : a).v;
  },
  async set(k,v){

    storeLayers = ok;
  }

function prepImage(file){
  return new Promise((res,rej)=>{
    const img = new Image(), u = URL.createObjectURL(file);
    img.onload = ()=>{
      const k = Math.min(1, 1400/Math.max(img.width,img.height));
      const c = document.createElement('canvas'); c.width=Math.round(img.width*k); c.height=Math.round(img.height*k);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      const s = document.createElement('canvas'); s.width=s.height=16;
      const sx = s.getContext('2d'); sx.drawImage(img,0,0,16,16);
      const px = sx.getImageData(0,0,16,16).data; let L=0;
      for(let i=0;i<px.length;i+=4) L += .299*px[i]+.587*px[i+1]+.114*px[i+2];
      L /= (px.length/4);
      URL.revokeObjectURL(u);
      res({url:c.toDataURL('image/jpeg',.82), dark:L<110});
    };
    img.onerror = rej; img.src = u;
  });
}

/* ================= 模型调用（填了密钥用 DeepSeek 等兼容接口；没填则只在 Claude 内可用） ================= */
let aiBlockedUntil = 0, llmErr = '', lastErrNoteAt = 0;
const llmReady = () => Date.now() >= aiBlockedUntil;
async function callLLM(system, messages, maxTokens=300, timeout=15000){
  const ctl = new AbortController(), to = setTimeout(()=>ctl.abort(), timeout);
  try{
    let text;
    if(cfg.key){
      const base = (cfg.base || 'https://api.deepseek.com').replace(/\/+$/,'');
      const r = await fetch(base+'/chat/completions',{
        method:'POST', signal:ctl.signal,
        headers:{'Content-Type':'application/json','Authorization':'Bearer '+cfg.key},
        body:JSON.stringify({model:cfg.model||'deepseek-flash', messages:[{role:'system',content:system},...messages], max_tokens:maxTokens, temperature:1.1, stream:false})
      });
      const d = await r.json().catch(()=>({}));
      if(!r.ok) throw new Error((d.error && d.error.message) || ('HTTP '+r.status));
      text = d.choices && d.choices[0] && d.choices[0].message && d.choices[0].message.content;
    }else{
      const r = await fetch('https://api.anthropic.com/v1/messages',{
        method:'POST', signal:ctl.signal, headers:{'Content-Type':'application/json'},
        body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:maxTokens,system,messages})
      });
      const d = await r.json();
      if(!d.content) throw new Error('还没有填写 API 密钥');
      text = d.content.map(i=>i.type==='text'?i.text:'').join('');
    }
    text = (text||'').trim();
    if(!text) throw new Error('返回内容为空');
    llmErr = ''; return text;
  }catch(e){
    llmErr = e.name==='AbortError' ? '请求超时'
           : (e instanceof TypeError ? '连不上：请检查网络，或该接口不允许网页直接访问（跨域）' : (e.message || '连接失败'));
    aiBlockedUntil = Date.now() + 3*60*1000;
    throw e;
  }finally{ clearTimeout(to); }
}

async function aiAct(){
  if(!llmReady()) return null;
  const t = taskLabel();
  const sys = `你是「${myName()}」，正在安静地陪用户学习。用户这次在做：${t||'（没说）'}。已专注 ${Math.round(segMs()/60000)} 分钟。请编一个你此刻正在做的小动作或小念头，要贴合用户的任务，自然、具体、不夸张。只返回 JSON：{"s":"状态，不超过12字，以“在”开头","m":"对用户说的一句话，不超过35字，第一人称，语气安静温柔"}。不要其他文字。上一个状态：${lastActS||'无'}。`;
  try{

    const o = JSON.parse(raw.slice(raw.indexOf('{'), raw.lastIndexOf('}')+1));
    if(typeof o.s==='string' && typeof o.m==='string' && o.s && o.m) return {s:o.s.slice(0,14), m:o.m.slice(0,60)};
  }catch(e){}

}
async function changeStatus(){
  let a = null;
  if(Math.random() < .3) a = await aiAct();               // 偶尔让模型现想
  if(!a && Math.random() < .35) a = localThink();         // 或者现场拼一句
  if(!a) a = nextAct();                                   // 其余从“跟着你内容走”的状态里挑

}

function streakInfo(){
  const days = new Set(records.map(r=>dayKey(r.s)));
  let n = 0, t = Date.now();
  if(!days.has(dayKey(t))) t -= 86400000;
  while(days.has(dayKey(t))){ n++; t -= 86400000; }
  return {n, total: records.reduce((a,r)=>a+r.d,0)};
}
function render(){

  let t = running ? `今天第 ${n+1} 次专注进行中` : (n ? `今天已完成 ${n} 次` : '今天还没有开始');
  if(cfg.goal > 0) t += ` · 目标 ${Math.min(100, Math.floor(tm/(cfg.goal*60000)*100))}%`;
  $('#count').textContent = t;

function startFocus(){
  running = true; segStart = Date.now(); lastBlock = 0;
  curName = ''; curNotes = []; $('#curName').value = ''; awaiting = false;
  app.classList.add('running'); $('#go').textContent = '结束本次';
  nextStatusAt = rand(60,150)*1000; nextAskAt = rand(100,140)*1000;

function endFocus(){

  setStatus('在这儿陪着你'); wakeOff();
  if(d >= MIN_COUNT){
    records.push({id:newId(), s:segStart, e, d, name:curName, notes:curNotes});
    addNote(`本次专注${curName?'「'+curName+'」':''} ${fmtDur(d)} · 已记录`);

let selT = Date.now(), editingId = null, armedDel = null;
const wk = t => wkFmt.format(t).replace('周','');
function renderRecords(){
  const todayK = dayKey(Date.now()), selK = dayKey(selT);
  const st = streakInfo();
  $('#recSub').textContent = `北京时间 · 连续专注 ${st.n} 天 · 累计 ${fmtDur(st.total)}`;
  $('#navLabel').textContent = dateFmt.format(selT);

  $('#navNext').disabled = selK >= todayK;
  const mins = ms => Math.round(ms/60000);
  const days = [];
  for(let i=6;i>=0;i--){
    const t = selT - i*86400000, k = dayKey(t);
    const rs = records.filter(r=>dayKey(r.s)===k);
    days.push({t, k, n:rs.length, d:rs.reduce((a,r)=>a+r.d,0)});
  }

  $('#tWeekN').innerHTML = `${wN}<small>次</small>`;
  $('#tWeekD').innerHTML = `${mins(wD)}<small>分钟</small>`;
  const max = Math.max(30, ...days.map(x=>mins(x.d)));
  $('#bars').innerHTML = days.map(x=>`<div class="bar ${x.k===selK?'sel':''}" data-t="${x.t}"><em>${x.d?mins(x.d):''}</em><div style="height:${Math.max(4, mins(x.d)/max*84)}px"></div><span>${x.k===todayK?'今':wk(x.t)}</span></div>`).join('');
  $('#listCap').textContent = selK===todayK ? '今天的每一次' : dateFmt.format(selT) + ' 的每一次';

  $('#dayList').innerHTML = dayRecs.length

          : esc(r.name || `第 ${n} 次`);

        return `<div class="li" data-id="${esc(r.id)}">

          ${notes?`<div class="nt">${notes}</div>`:''}
          <div class="acts"><button data-act="ren">改名</button><button class="del" data-act="del">${armedDel===r.id?'确认删除':'删除'}</button></div>
        </div>`;
      }).join('')
    : '<div class="empty">这一天没有记录。</div>';
  if(editingId){ const ri = $('#ri'); if(ri){ ri.focus(); ri.setSelectionRange(ri.value.length, ri.value.length); } }

function importBackup(text){
  let o;
  try{ o = JSON.parse(String(text).trim()); }catch(e){ return '这不是有效的备份内容。'; }
  if(!o || o.app !== 'study-companion') return '这不是本页面导出的备份。';
  const have = new Set(records.map(r=>r.id)); let added = 0;
  (o.records||[]).forEach(r=>{ if(r && r.id && !have.has(r.id)){ records.push({name:'',notes:[],...r}); have.add(r.id); added++; } });
  records.sort((a,b)=>a.s-b.s);
  const seen = new Set(chatLog.map(e=>e.t+'|'+e.text));
  (o.chat||[]).forEach(e=>{ if(e && e.text && !seen.has(e.t+'|'+e.text)) chatLog.push(e); });
  chatLog.sort((a,b)=>a.t-b.t);
  if(o.prefs) prefs = {...prefs, ...o.prefs};
  if(o.cfg) cfg = {...cfg, ...o.cfg, key:cfg.key, lastBackup:Math.max(cfg.lastBackup||0, o.cfg.lastBackup||0)};
  if(o.bgimg){ bgImgData = o.bgimg; store.set('sc:bgimg', o.bgimg); }
  applyPrefsUI(); rebuildFeed(); render(); fillSettings();
  saveRecords(); flushChat(); savePrefs(); saveCfg();
  return `已恢复：新增 ${added} 条专注记录，聊天记录已合并。`;
}

/* ================= 对话 ================= */
const FALLBACK = ['我在这儿，一次只做一件事。','你做得很好，继续吧。','嗯，我听到了。先深呼吸，再读下一段。','好，我哪儿也不去。','没关系，小小的一步也算数。'];
const history = [];
async function ai(){
  if(!llmReady()) return null;
  const sys = `你是「${myName()}」，一个安静温柔的学习陪伴者，正坐在用户身边陪他学习。${running?'用户正在专注中，本次已 '+fmtClock(segMs())+(curName?'，这次专注叫「'+curName+'」':'')+(curNotes.length?'，最近在做：'+curNotes[curNotes.length-1].text:'')+'。':'用户目前没有在计时。'}今天已完成 ${todayRecords().length} 次专注，共 ${Math.round(todayMs()/60000)} 分钟。你现在${currentAct?currentAct.s:'安静地坐在旁边'}。请用中文回复，1到2句话，不超过40个字，语气温柔、踏实，像一个安静的朋友。不要列清单，不要用表情符号，不要说教。如果用户看起来卡住或累了，鼓励一个很小的下一步或短暂休息。`;
  try{ return await callLLM(sys, history.slice(-8), 300); }catch(e){ return null; }
}
function parseNameCmd(t){
  const q = '[：:\\s]*[「"“]?(.+?)[」"”]?$';
  const pats = [
    new RegExp('^(?:请)?(?:把)?(?:这次|本次|当前)(?:专注)?(?:命名为|命名成|叫做|叫作|叫|改名为|改成|取名为|取名叫|标记为|设为|是)'+q),
    new RegExp('^(?:命名|取名|改名)(?:为|成)?'+q),
    new RegExp('^(?:给)?(?:这次|本次)(?:专注)?(?:起名|取名|命名)(?:为|叫)?'+q),
  ];
  for(const p of pats){ const m = t.match(p); if(m && m[1]) return m[1].trim(); }
  return null;
}
const cleanTask = t => t.replace(/^(?:我)?(?:现在|正)?(?:在|正在)/,'').replace(/[呢啊啦哦。.!！\s]+$/,'').trim().slice(0,24) || t.trim().slice(0,24);
async function sendMsg(){
  const inp = $('#inp'), text = inp.value.trim(); if(!text) return;
  inp.value=''; addMsg('me', text);

  const nm = parseNameCmd(text);
  if(nm){
    if(!running){ themSay('先点「开始专注」，我再帮你给这次命名。', {delay:400}); return; }
    setCurName(nm); themSay(`好，这次专注叫「${curName}」。`, {delay:400}); return;
  }
  const nt = text.match(/^(?:记一下|记录一下|记录)[：:\s]*(.+)$/);
  if(nt && running){ addCurNote(nt[1]); themSay('记下了。', {delay:300}); return; }

  if(awaiting && running && Date.now() < awaitUntil){
    awaiting = false;
    const task = cleanTask(text);
    if(!curName){ setCurName(task); themSay(`好，这次就记作「${curName}」。我陪你。`, {delay:500}); }
    else { addCurNote(task); themSay(pick(['嗯，记下了。','好，继续加油。','收到，我陪着你。']), {delay:400}); }
    return;
  }

  history.push({role:'user',content:text});
  const reply = await ai();
  if(!reply && cfg.key && llmErr && Date.now() - lastErrNoteAt > 5*60*1000){
    lastErrNoteAt = Date.now(); addNote(`模型暂时连不上（${llmErr}），先用预设回复。可在「设置」里测试连接。`);
  }
  const out = reply || pick(FALLBACK);
  history.push({role:'assistant',content:out});
  themSay(out, {delay:400});
}
$('#send').onclick = sendMsg;
$('#inp').onkeydown = e=>{ if(e.key==='Enter' && !e.isComposing) sendMsg(); };

  setTimeout(()=>themSay(n ? `欢迎回来。今天已经专注 ${n} 次了，准备好就继续吧，我在这儿。` : '我在这儿。准备好了就点「开始专注」。', {delay:600}), 400);
  if(records.length){
    const days = cfg.lastBackup ? Math.floor((Date.now()-cfg.lastBackup)/86400000) : 999;
    if(days >= 7){
      setTimeout(()=>themSay((cfg.lastBackup ? `小提醒：记录已经 ${days} 天没有备份了。` : '小提醒：你的记录还没有备份过。') + '点「设置」里的「导出备份文件」，就算手机清理了浏览器数据，也能找回来。', {delay:600}), 4000);
    }
  }
})();
</script>
